services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-acompanhamento
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  
  moodle-simulado:
    build:
      context: ./moodle-simulado
    container_name: moodle-simulado
    ports:
      - "8000:8000"
    restart: unless-stopped


volumes:
  rabbitmq_data:

  
